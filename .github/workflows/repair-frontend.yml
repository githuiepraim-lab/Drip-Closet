name: Drip Closet frontend repair

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch frontend Supabase integration
        run: |
          python3 <<'PY'
          from pathlib import Path

          files = [
              'drip_closet_website.html',
              'drip_closet_admin.html',
              'drip_closet_pos.html',
              'drip_closet_photoshop.html',
          ]
          tags = '''\n<!-- Drip Closet shared Supabase runtime -->\n<script src="js/supabase-client.js"></script>\n<script src="js/auth-api.js"></script>\n<script src="js/products-api.js"></script>\n<script src="js/drip-closet-runtime.js"></script>\n'''

          for name in files:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')

              if name == 'drip_closet_website.html':
                  s=s.replace("connect-src 'self' https://source.unsplash.com https://api.unsplash.com;", "connect-src 'self' https://cezhlycsuecrvwfxbrpg.supabase.co https://source.unsplash.com https://api.unsplash.com;")
                  s=s.replace("script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;", "script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;")

              if 'js/drip-closet-runtime.js' not in s:
                  marker='</body>'
                  if marker in s:
                      s=s.replace(marker, tags + marker, 1)
                  else:
                      s += tags
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add drip_closet_website.html drip_closet_admin.html drip_closet_pos.html drip_closet_photoshop.html js/drip-closet-runtime.js
          if git diff --cached --quiet; then
            echo 'No frontend changes required.'
          else
            git commit -m 'fix: wire frontend apps to Supabase runtime'
            git push
          fi
